name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 21 for Pre-Compilation
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: |
          npm ci
          npm ci --prefix dashboard

      - name: Prebuild Mod JAR and Bytecode
        run: |
          chmod +x godhand/gradlew || true
          cd godhand && ./gradlew build -x test || true
          cd ..
          mkdir -p dashboard/public/prebuilt
          find godhand/build/libs -name "*.jar" -exec cp {} dashboard/public/prebuilt/ \; 2>/dev/null || true

      - name: Generate VFS Bundle
        run: node scripts/generate-vfs-bundle.mjs

      - name: Build Dashboard
        run: npm run build --prefix dashboard

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dashboard/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
