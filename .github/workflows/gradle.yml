# This workflow will build a Java project with Gradle and cache/restore any dependencies.
name: Java CI with Gradle

on:
  push:
    branches: [ "**" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Delete old artifacts
      uses: geekyeggo/delete-artifact@v5
      with:
        name: godhand-mod
        failOnError: false

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make Gradle Wrapper executable
      # Minecraft Mods brauchen oft manuell die Berechtigung, das Gradle-Skript auszuführen, sonst crasht der Build direkt.
      run: chmod +x godhand/gradlew

    - name: Build with Gradle Wrapper (and Run Tests)
      run: |
        cd godhand
        ./gradlew build

    - name: Upload test report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-test-report
        path: godhand/build/reports/tests/test/
        if-no-files-found: ignore

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: godhand-mod
        path: "godhand/build/libs/*.jar"
        if-no-files-found: warn

    - name: SonarQube Scan
      if: env.SONAR_TOKEN != ''
      uses: sonarsource/sonarcloud-github-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        projectBaseDir: godhand
        args: >
          -Dsonar.organization=ezdev0
          -Dsonar.projectKey=EZdev0_GodHand
          -Dsonar.java.binaries=build/classes/java/main

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: godhand-mod

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: "*.jar"
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
        name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Build' }}
        body: 'Automated build generated from push to main.'
        draft: false
        prerelease: false
