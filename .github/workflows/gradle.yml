# This workflow will build a Java project with Gradle and cache/restore any dependencies.
name: Java CI with Gradle

on:
  push:
    branches: [ "**" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      targetMod:
        description: 'Target mod folder to build (e.g. godhand or mods/arm32-fix)'
        required: false
        default: 'godhand'
  issues:
    types: [opened]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      issues: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Delete old artifacts
      uses: geekyeggo/delete-artifact@v5
      with:
        name: godhand-mod
        failOnError: false

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make Gradle Wrapper executable
      # Minecraft mods often require explicit execute permissions for the wrapper script to avoid build failures.
      run: |
        chmod +x godhand/gradlew || true
        if [ -d "mods" ]; then
          find mods -name "gradlew" -exec chmod +x {} + || true
        fi

    - name: Label Issue
      if: github.event_name == 'issues' && contains(github.event.issue.title, '[CLOUD-BUILD]')
      uses: actions/github-script@v7
      with:
        script: |
          try {
            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['build', 'task']
            });
          } catch (e) {
            console.log('Error adding labels:', e.message);
          }

    - name: Build with Gradle Wrapper (and Run Tests)
      id: build_step
      run: |
        if [ "${{ github.event_name }}" = "issues" ]; then
          TITLE="${{ github.event.issue.title }}"
          if echo "$TITLE" | grep -q "\[CLOUD-BUILD\]"; then
            TARGET=$(echo "$TITLE" | sed 's/\[CLOUD-BUILD\]//' | tr -d ' ' | tr -d '\r' | tr -d '\n')
            echo "Detected IssueOps Cloud Build request for target: $TARGET"
          else
            echo "Not a [CLOUD-BUILD] issue. Skipping build."
            exit 0
          fi
        else
          TARGET="${{ github.event.inputs.targetMod || 'godhand' }}"
        fi

        DIR="godhand"
        if [ -d "$TARGET" ]; then
          DIR="$TARGET"
        elif [ -d "mods/$TARGET" ]; then
          DIR="mods/$TARGET"
        else
          echo "Target $TARGET not found directly, searching workspace..."
          FOUND=$(find mods -maxdepth 2 -type d -name "$TARGET" 2>/dev/null | head -n 1)
          if [ -n "$FOUND" ] && [ -d "$FOUND" ]; then
            DIR="$FOUND"
          fi
        fi

        echo "Building target mod directory: $DIR"
        echo "target=$TARGET" >> $GITHUB_OUTPUT
        echo "dir=$DIR" >> $GITHUB_OUTPUT
        cd "$DIR"
        if [ -f "gradlew" ]; then
          ./gradlew build
        else
          gradle build || true
        fi

    - name: Comment on Issue
      if: github.event_name == 'issues' && contains(github.event.issue.title, '[CLOUD-BUILD]') && always()
      uses: actions/github-script@v7
      with:
        script: |
          const isSuccess = '${{ job.status }}' === 'success';
          const status = isSuccess ? '✅ **Success**' : '❌ **Failed**';
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const target = '${{ steps.build_step.outputs.target }}' || 'godhand';
          const cleanMod = target.replace(/^mods\//, '').replace(/\//g, '');
          const jarName = cleanMod.includes('arm32') ? 'arm32-fix-1.0.0.jar' : `${cleanMod}-1.0.0.jar`;
          const directDownloadUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/releases/download/latest/${jarName}`;
          const artifactUrl = isSuccess ? directDownloadUrl : runUrl;
          const body = [
            `### ⚡ GodHand Studio Cloud Build Result`,
            `- **Status**: ${status}`,
            `- **Direct Mod Download (Public, Token-Free)**: [Download ${jarName}](${directDownloadUrl})`,
            `- **Workflow Run**: [View Run on GitHub Actions](${runUrl})`,
            ``,
            `_Delivered directly to GodHand Studio Web IDE Session._`,
            `<!-- GODHAND_CI_SESSION: {"status": "${{ job.status }}", "runId": "${context.runId}", "artifactUrl": "${artifactUrl}", "runUrl": "${runUrl}", "target": "${target}", "issueNumber": ${context.issue.number}} -->`
          ].join('\n');

          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });

    - name: Upload test report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-test-report
        path: |
          godhand/build/reports/tests/test/
          mods/*/build/reports/tests/test/
        if-no-files-found: ignore

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: godhand-mod
        path: |
          godhand/build/libs/*.jar
          mods/*/build/libs/*.jar
        if-no-files-found: warn

    - name: SonarQube Scan
      if: env.SONAR_TOKEN != '' && (github.event.inputs.targetMod == '' || github.event.inputs.targetMod == 'godhand')
      uses: sonarsource/sonarcloud-github-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        projectBaseDir: godhand
        args: >
          -Dsonar.organization=ezdev0
          -Dsonar.projectKey=EZdev0_GodHand
          -Dsonar.java.binaries=build/classes/java/main

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || (github.event_name == 'issues' && contains(toJson(github.event), '[CLOUD-BUILD]'))
    permissions:
      contents: write

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: godhand-mod
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: "artifacts/**/*.jar"
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
        name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Build' }}
        body: 'Automated build generated from push to main.'
        draft: false
        prerelease: false
