# This workflow will build a Java project with Gradle and cache/restore any dependencies.
name: Java CI with Gradle

on:
  push:
    branches: [ "**" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      targetMod:
        description: 'Target mod folder to build (e.g. godhand or mods/arm32-fix)'
        required: false
        default: 'godhand'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Delete old artifacts
      uses: geekyeggo/delete-artifact@v5
      with:
        name: godhand-mod
        failOnError: false

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make Gradle Wrapper executable
      # Minecraft Mods brauchen oft manuell die Berechtigung, das Gradle-Skript auszuführen, sonst crasht der Build direkt.
      run: |
        chmod +x godhand/gradlew || true
        if [ -d "mods" ]; then
          find mods -name "gradlew" -exec chmod +x {} + || true
        fi

    - name: Build with Gradle Wrapper (and Run Tests)
      run: |
        TARGET="${{ github.event.inputs.targetMod || 'godhand' }}"
        if [ -d "$TARGET" ]; then
          echo "Building target mod directory: $TARGET"
          cd "$TARGET"
          if [ -f "gradlew" ]; then
            ./gradlew build
          else
            gradle build || true
          fi
        else
          echo "Target $TARGET not found, falling back to godhand"
          cd godhand
          ./gradlew build
        fi

    - name: Upload test report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-test-report
        path: |
          godhand/build/reports/tests/test/
          mods/*/build/reports/tests/test/
        if-no-files-found: ignore

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: godhand-mod
        path: |
          godhand/build/libs/*.jar
          mods/*/build/libs/*.jar
        if-no-files-found: warn

    - name: SonarQube Scan
      if: env.SONAR_TOKEN != '' && (github.event.inputs.targetMod == '' || github.event.inputs.targetMod == 'godhand')
      uses: sonarsource/sonarcloud-github-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        projectBaseDir: godhand
        args: >
          -Dsonar.organization=ezdev0
          -Dsonar.projectKey=EZdev0_GodHand
          -Dsonar.java.binaries=build/classes/java/main

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: godhand-mod
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: "artifacts/**/*.jar"
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
        name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Build' }}
        body: 'Automated build generated from push to main.'
        draft: false
        prerelease: false
