# This workflow will build a Java project with Gradle and cache/restore any dependencies.
name: Java CI with Gradle

on:
  push:
    branches: [ "**" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      targetMod:
        description: 'Target mod folder to build (e.g. godhand or mods/arm32-fix)'
        required: false
        default: 'godhand'
  issues:
    types: [opened]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      issues: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Delete old artifacts
      uses: geekyeggo/delete-artifact@v5
      with:
        name: godhand-mod
        failOnError: false

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make Gradle Wrapper executable
      # Minecraft mods often require explicit execute permissions for the wrapper script to avoid build failures.
      run: |
        chmod +x godhand/gradlew || true
        if [ -d "mods" ]; then
          find mods -name "gradlew" -exec chmod +x {} + || true
        fi

    - name: Build with Gradle Wrapper (and Run Tests)
      run: |
        if [ "${{ github.event_name }}" = "issues" ]; then
          TITLE="${{ github.event.issue.title }}"
          if echo "$TITLE" | grep -q "\[CLOUD-BUILD\]"; then
            TARGET=$(echo "$TITLE" | sed 's/\[CLOUD-BUILD\]//' | tr -d ' ' | tr -d '\r' | tr -d '\n')
            echo "Detected IssueOps Cloud Build request for target: $TARGET"
          else
            echo "Not a [CLOUD-BUILD] issue. Skipping build."
            exit 0
          fi
        else
          TARGET="${{ github.event.inputs.targetMod || 'godhand' }}"
        fi

        if [ -d "$TARGET" ]; then
          echo "Building target mod directory: $TARGET"
          cd "$TARGET"
          if [ -f "gradlew" ]; then
            ./gradlew build
          else
            gradle build || true
          fi
        else
          echo "Target $TARGET not found, falling back to godhand"
          cd godhand
          ./gradlew build
        fi

    - name: Comment on Issue
      if: github.event_name == 'issues' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const status = '${{ job.status }}' === 'success' ? '✅ **Success**' : '❌ **Failed**';
          const body = status + ' - Cloud Build completed for run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + '\n\nCompiled JAR artifacts are available under the workflow run and Releases.';
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });

    - name: Upload test report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-test-report
        path: |
          godhand/build/reports/tests/test/
          mods/*/build/reports/tests/test/
        if-no-files-found: ignore

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: godhand-mod
        path: |
          godhand/build/libs/*.jar
          mods/*/build/libs/*.jar
        if-no-files-found: warn

    - name: SonarQube Scan
      if: env.SONAR_TOKEN != '' && (github.event.inputs.targetMod == '' || github.event.inputs.targetMod == 'godhand')
      uses: sonarsource/sonarcloud-github-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        projectBaseDir: godhand
        args: >
          -Dsonar.organization=ezdev0
          -Dsonar.projectKey=EZdev0_GodHand
          -Dsonar.java.binaries=build/classes/java/main

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: godhand-mod
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: "artifacts/**/*.jar"
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
        name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Build' }}
        body: 'Automated build generated from push to main.'
        draft: false
        prerelease: false
