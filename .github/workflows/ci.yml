name: GodHand Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Lint, Test & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix dashboard

      - name: TypeScript Linting Check
        run: npm run lint --prefix dashboard

      - name: Build Web IDE Dashboard
        run: npm run build --prefix dashboard

      - name: Run Automated Test Suites
        run: npm test

      - name: Verify Gradle Wrapper Executable
        run: |
          chmod +x godhand/gradlew
          cd godhand
          ./gradlew --version
